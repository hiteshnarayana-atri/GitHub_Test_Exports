name: Allure Report

on:
  workflow_run:
    workflows: ["main - CI"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Report
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v4

      - name: Download test artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts
          if_no_artifact_found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.29.0
          curl -sL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" -o /tmp/allure.tgz
          sudo tar -C /opt -xzf /tmp/allure.tgz
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Merge allure results
        run: |
          mkdir -p allure-results-merged
          find artifacts -type d -name "allure-results" -print0 | 
            while IFS= read -r -d '' d; do cp -r "$d"/. allure-results-merged/; done
          ls -la allure-results-merged || true

      - name: Generate report
        run: |
          if [ -d "allure-results-merged" ] && [ -n "$(ls -A allure-results-merged 2>/dev/null)" ]; then
            allure generate allure-results-merged -o public --clean
          else
            mkdir -p public
            echo "<h1>No test results available</h1>" > public/index.html
          fi

      - uses: actions/configure-pages@v5
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
