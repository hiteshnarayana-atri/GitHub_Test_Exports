name: main - CI

on:
  pull_request:
    branches: [HN_feature_GitHub_Test_Exports]
    paths:
      - '**.py'
      - 'cypress/**'
      - '.github/workflows/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# Backend
jobs:
  app-backend:
    name: Backend • ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ base, notifications ]  # We can extend the matrix with more apps later
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            **/requirements*.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
          pip install pytest pytest-django pytest-cov model-bakery

      - name: Run pytest (JUnit + coverage)
        run: |
          mkdir -p reports/${{ matrix.app }}/backend
          if [ -d "${{ matrix.app }}/tests" ]; then
            pytest -q ${{ matrix.app }}/tests \
              --junitxml=reports/${{ matrix.app }}/backend/pytest.xml \
              --cov=${{ matrix.app }} \
              --cov-report=xml:reports/${{ matrix.app }}/backend/coverage.xml
          else
            pytest -q \
              --junitxml=reports/${{ matrix.app }}/backend/pytest.xml \
              --cov=base \
              --cov-report=xml:reports/${{ matrix.app }}/backend/coverage.xml
          fi

      - name: Convert JUnit to CSV (with GitHub metadata)
        run: |
          python scripts/convert_junit_to_csv.py \
            "reports/${{ matrix.app }}/backend/pytest.xml" \
            "reports/${{ matrix.app }}/backend/tests_backend.csv" \
            "${{ matrix.app }}" "pytest" \
            "${{ github.run_id }}" "${{ github.run_number }}" \
            "${{ github.sha }}" "${{ github.ref_name }}" \
            "${{ github.workflow }}"

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-backend-reports
          path: reports/${{ matrix.app }}/backend/*
          retention-days: 7
          if-no-files-found: error

      - name: Publish backend test summary
        uses: dorny/test-reporter@v1 
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          name: "${{ matrix.app }} Django Tests"
          path: reports/${{ matrix.app }}/backend/pytest.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # FRONTEND
  app-frontend:
    name: Frontend for base app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend deps for local server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
          python manage.py migrate --noinput

      - name: Start Django dev server
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 >/dev/null 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:8000/ && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Cypress deps
        run: npm ci

      - name: Run Cypress (headless, JUnit)
        run: |
          mkdir -p reports/base/frontend
          npx cypress run --browser chrome

      - name: Convert Cypress JUnit → CSV (with GitHub metadata)
        run: |
          python scripts/convert_junit_to_csv.py \
            "reports/frontend/*.xml" \
            "reports/base/frontend/tests_frontend.csv" \
            "base" "cypress" \
            "${{ github.run_id }}" "${{ github.run_number }}" \
            "${{ github.sha }}" "${{ github.ref_name }}" \
            "${{ github.workflow }}"

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-frontend-reports
          path: |
            reports/base/frontend/*.csv
            reports/frontend/*.xml
            cypress/videos/**
            cypress/screenshots/**
          retention-days: 7

      - name: Publish Cypress test summary
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          name: "Cypress E2E (base)"
          path: reports/frontend/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # AGGREGATE
  aggregate:
    name: Aggregate Reports
    runs-on: ubuntu-latest
    needs: [ app-backend, app-frontend ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download base backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: base-backend-reports
          path: collected/base/backend

      - name: Download notifications backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: notifications-backend-reports
          path: collected/notifications/backend

      - name: Download base frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: base-frontend-reports
          path: collected/base/frontend

      - name: Merge all JUnit to CSV & JSON
        run: |
          python scripts/merge_junit_tests.py 'collected/**/*.xml' collected/out
          ls -la collected/out
          head -n 5 collected/out/all_tests.csv || true

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-reports
          path: collected/out/*
          retention-days: 30
