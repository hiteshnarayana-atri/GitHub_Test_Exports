name: main - CI

on:
  push:
    branches:
      - main
      - HN_feature_GitHub_Test_Exports
      - HN_personal_GitHub_Test_Exports
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            **/requirements*.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
          pip install pytest pytest-django pytest-cov model-bakery

      - name: Run pytest (JUnit + coverage)
        run: |
          mkdir -p reports/backend
          pytest -q \
            --junitxml=reports/backend/pytest.xml \
            --cov=base \
            --cov-report=xml:reports/backend/coverage.xml

      - name: Convert backend JUnit XML → CSV
        run: |
          python scripts/convert_junit_to_csv.py reports/backend/pytest.xml reports/backend/tests_backend.csv backend pytest

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: reports/backend/*
          retention-days: 7
          if-no-files-found: error

      - name: Publish backend test summary
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          name: Django Tests
          path: reports/backend/pytest.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  frontend_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend deps for server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
          python manage.py migrate --noinput

      - name: Start Django server
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 >/dev/null 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:8000/ && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Cypress deps
        run: npm ci

      - name: Run Cypress headless (JUnit)
        run: |
          mkdir -p reports/frontend
          npx cypress run --browser chrome

      - name: Convert frontend JUnit XML → CSV
        run: |
          python scripts/convert_junit_to_csv.py 'reports/frontend/*.xml' reports/frontend/tests_frontend.csv frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: |
            reports/frontend/*.xml
            reports/frontend/tests_frontend.csv
            cypress/videos/**
            cypress/screenshots/**
          retention-days: 7

      - name: Publish Cypress test summary
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          name: Cypress E2E
          path: reports/frontend/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  aggregate:
    runs-on: ubuntu-latest
    needs: [ backend, frontend_e2e ]
    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-reports
          path: collected/backend

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-reports
          path: collected/frontend

      - name: Merge all the test reports (XML → CSV & JSON)
        run: |
          python scripts/merge_all_tests.py 'collected/**/*.xml' collected/out

      - name: Upload combined stakeholder reports
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-reports
          path: collected/out/*
          retention-days: 30
