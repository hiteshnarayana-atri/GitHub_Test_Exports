name: main - CI

on:
  pull_request:
    branches: [ main, HN_feature_GitHub_Test_Exports ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  test:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: base
            has_frontend: true
          - app: notifications
            has_frontend: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow pytest pytest-django pytest-cov model-bakery

      # Backend tests
      - name: Run pytest
        run: |
          mkdir -p reports/${{ matrix.app }}/backend
          TEST_PATH=${{ matrix.app }}/tests
          COV_TARGET=${{ matrix.app }}
          [ ! -d "$TEST_PATH" ] && TEST_PATH=tests && COV_TARGET=base
          pytest -q "$TEST_PATH" \
            --junitxml=reports/${{ matrix.app }}/backend/pytest.xml \
            --cov="$COV_TARGET" \
            --cov-report=xml:reports/${{ matrix.app }}/backend/coverage.xml

      - name: Export backend results
        run: |
          python scripts/convert_junit_to_csv.py \
            "reports/${{ matrix.app }}/backend/pytest.xml" \
            "reports/${{ matrix.app }}/backend/tests.csv" \
            "${{ matrix.app }}" "pytest"

      - name: Upload backend results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ matrix.app }}-backend
          path: reports/${{ matrix.app }}/backend/*
          retention-days: 7

      - name: Backend test report
        uses: dorny/test-reporter@v1
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        with:
          name: "${{ matrix.app }} • Django"
          path: reports/${{ matrix.app }}/backend/pytest.xml
          reporter: java-junit
          fail-on-error: false

      # Frontend tests (base only)
      - uses: actions/setup-node@v4
        if: ${{ matrix.has_frontend }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Start Django server
        if: ${{ matrix.has_frontend }}
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "Server is up!"
              break
            fi
            if [ $i -eq 40 ]; then
              echo "Server failed to start. Logs:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Cypress
        if: ${{ matrix.has_frontend }}
        run: |
          npm ci
          mkdir -p reports/${{ matrix.app }}/frontend
          npx cypress run --browser chrome

      - name: Export frontend results
        if: ${{ matrix.has_frontend }}
        run: |
          python scripts/convert_junit_to_csv.py \
            "reports/frontend/*.xml" \
            "reports/${{ matrix.app }}/frontend/tests.csv" \
            "${{ matrix.app }}" "cypress"

      - name: Upload frontend results
        if: ${{ always() && matrix.has_frontend }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-frontend
          path: |
            reports/${{ matrix.app }}/frontend/*.csv
            reports/frontend/*.xml
            cypress/videos/**
            cypress/screenshots/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Frontend test report
        if: ${{ always() && matrix.has_frontend && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: dorny/test-reporter@v1
        with:
          name: "${{ matrix.app }} • Cypress"
          path: reports/frontend/*.xml
          reporter: java-junit
          fail-on-error: false

  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs: [ test ]
    if: ${{ always() }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
        continue-on-error: true

      - name: Merge test results
        run: |
          python scripts/merge_junit_tests.py 'collected/**/*.xml' collected/out
          find collected/out -type f -name 'all_tests.*' -exec ls -lh {} \;

      - name: Upload aggregated reports
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-reports
          path: collected/out/**/*
          retention-days: 30
